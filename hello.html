<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal page of Bryan, MSc Business Analytics student.">
  <title>Bryan | Personal Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #101827;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      max-width: 650px;
      width: 100%;
      padding: 48px 32px;
      background: #1c293b;
      border: 1px solid #34445b;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .tag {
      display: inline-block;
      color: #7dd3fc;
      background: #263e54;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 36px;
    }

    .divider {
      width: 50px;
      height: 3px;
      background: #38bdf8;
      margin: 0 auto 30px;
      border-radius: 5px;
    }

    .description {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #dbeafe;
      margin-bottom: 36px;
    }

    .date {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      main {
        padding: 40px 24px;
      }

      .description {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <span class="tag">Personal Profile</span>

    <h1>Bryan.</h1>

    <p class="subtitle">
      MSc student, National College of Ireland
    </p>

    <div class="divider"></div>

    <p class="description">
      I am passionate about understanding how businesses can use data,
      economics and critical thinking to make better strategic decisions.
    </p>

    <p class="date">
      <span id="today"></span>
    </p>
  </main>

  <script>
    const today = new Date();

    document.getElementById("today").textContent =
      today.toLocaleDateString("en-IE", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
  </script>

</body>
</html>
